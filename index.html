<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký Thông Tin Người Dùng</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen-wrapper">
      <div class="form-container">
        <h2 class="form-title">ĐĂNG KÝ THÔNG TIN NGƯỜI DÙNG</h2>

        <form id="registerForm" autocomplete="off" method="POST" action="xuly_dangky.php">
          <div class="form-group">
            <label for="fullname">HỌ VÀ TÊN</label>
            <input type="text" id="fullname" name="fullname" class="form-control" />
            <span class="error-msg" id="err-fullname"></span>
          </div>

          <div class="form-group">
            <label>NGÀY SINH</label>
            <div class="dob-group">
              <select id="dobDay" name="dobDay" class="form-control dob-select">
                <option value="">Ngày</option>
              </select>
              <select id="dobMonth" name="dobMonth" class="form-control dob-select">
                <option value="">Tháng</option>
              </select>
              <select id="dobYear" name="dobYear" class="form-control dob-select">
                <option value="">Năm</option>
              </select>
            </div>
            <span class="error-msg" id="err-dob"></span>
          </div>

          <div class="form-group gender-group">
            <label class="gender-title">GIỚI TÍNH</label>
            <div class="radio-wrapper">
              <input type="radio" id="nam" name="gender" value="Nam" class="custom-radio" checked />
              <label for="nam" class="radio-label">Nam</label>
              <input type="radio" id="nu" name="gender" value="Nữ" class="custom-radio" />
              <label for="nu" class="radio-label">Nữ</label>
            </div>
          </div>

          <div class="form-group">
            <label for="phone">SỐ ĐIỆN THOẠI</label>
            <input type="text" id="phone" name="phone" class="form-control" maxlength="11" />
            <span class="error-msg" id="err-phone"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" />
            <span class="error-msg" id="err-email"></span>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" />
            <span class="error-msg" id="err-password"></span>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu</label>
            <input type="password" id="confirmPassword" class="form-control" />
            <span class="error-msg" id="err-confirm"></span>
          </div>

          <div class="form-group">
            <label for="city">Tỉnh/Thành phố</label>
            <div class="custom-dropdown-wrapper">
              <input type="text" id="city" name="city" class="form-control" placeholder="Gõ để tìm hoặc chọn..." autocomplete="off"/>
              <div class="dropdown-list hidden" id="cityDropdown"></div>
            </div>
            <span class="error-msg" id="err-city"></span>
          </div>

          <div class="form-group terms-group">
            <input type="checkbox" id="terms" class="custom-checkbox" />
            <label for="terms" class="terms-label">Đồng ý điều khoản</label>
          </div>

          <div class="submit-group">
            <button type="button" id="clearBtn" class="clear-btn">Xóa form</button>
            <button type="submit" id="submitBtn" class="submit-btn" disabled>ĐĂNG KÍ</button>
          </div>
        </form>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
